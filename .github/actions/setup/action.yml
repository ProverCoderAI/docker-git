name: Setup
description: Perform standard setup and install dependencies using Bun.
inputs:
  bun-version:
    description: The version of Bun to install
    required: true
    default: 1.3.11
  node-version:
    description: The version of Node.js to install for compatibility/native builds
    required: true
    default: 24

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install OpenSSH client
      shell: bash
      run: |
        for attempt in 1 2 3; do
          sudo rm -rf /var/lib/apt/lists/*
          if sudo apt-get -o Acquire::Retries=3 -o Acquire::By-Hash=force update; then
            break
          fi
          if [[ "$attempt" == "3" ]]; then
            echo "apt-get update failed after retries" >&2
            exit 1
          fi
          echo "apt-get update attempt ${attempt} failed; retrying..." >&2
          sleep $((attempt * 2))
        done
        sudo apt-get -o Acquire::Retries=3 install -y openssh-client
    - name: Install node-gyp
      shell: bash
      run: npm install -g node-gyp
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
