name: Setup
description: Perform standard setup and install dependencies using Bun.
inputs:
  bun-version:
    description: The version of Bun to install
    required: true
    default: 1.3.14
  node-version:
    description: The version of Node.js to install for compatibility/native builds
    required: true
    default: 24

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install OpenSSH client
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if command -v ssh >/dev/null 2>&1 && command -v ssh-keygen >/dev/null 2>&1; then
          echo "OpenSSH client is already installed; skipping apt install"
          exit 0
        fi

        for attempt in 1 2 3; do
          sudo rm -rf /var/lib/apt/lists/*
          if sudo timeout 120s apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::By-Hash=force \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update; then
            break
          fi
          if [[ "$attempt" == "3" ]]; then
            echo "apt-get update failed after retries" >&2
            exit 1
          fi
          echo "apt-get update attempt ${attempt} failed; retrying..." >&2
          sleep $((attempt * 2))
        done
        sudo timeout 120s apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          install -y openssh-client
    - name: Install node-gyp
      shell: bash
      run: npm install -g node-gyp
    - name: Install dependencies
      shell: bash
      run: |
        run_bun_install() {
          local timeout_seconds=$((20 * 60))
          bun install --frozen-lockfile &
          local install_pid="$!"
          (
            sleep "$timeout_seconds"
            echo "bun install exceeded 20 minutes; terminating" >&2
            kill "$install_pid" 2>/dev/null || true
          ) &
          local timeout_pid="$!"
          local status=0
          wait "$install_pid" || status="$?"
          kill "$timeout_pid" 2>/dev/null || true
          wait "$timeout_pid" 2>/dev/null || true
          return "$status"
        }

        for attempt in 1 2 3; do
          if run_bun_install; then
            exit 0
          fi
          if [[ "$attempt" == "3" ]]; then
            echo "bun install failed after retries" >&2
            exit 1
          fi
          echo "bun install attempt ${attempt} failed; retrying..." >&2
          sleep $((attempt * 2))
        done
