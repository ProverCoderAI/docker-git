name: Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Build (docker-git package)
        run: bun run --cwd packages/app build
      - name: Build (session sync package)
        run: |
          if [ -f packages/docker-git-session-sync/package.json ]; then
            bun run --cwd packages/docker-git-session-sync build
          else
            echo "packages/docker-git-session-sync is not present; skipping"
          fi
      - name: Build (api)
        run: bun run --cwd packages/api build

  dist-deps-prune:
    name: Dist deps prune
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 24.14.0
      - name: Build package
        run: bun run --cwd packages/app build
      - name: Dist deps prune (lint)
        run: bun run check:dist-deps-prune

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Typecheck (app)
        run: bun run --cwd packages/app check
      - name: Typecheck (session sync)
        run: |
          if [ -f packages/docker-git-session-sync/package.json ]; then
            bun run --cwd packages/docker-git-session-sync typecheck
          else
            echo "packages/docker-git-session-sync is not present; skipping"
          fi
      - name: Typecheck (lib)
        run: bun run --cwd packages/lib typecheck
      - name: Typecheck (api)
        run: bun run --cwd packages/api typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Lint (app)
        run: bun run --cwd packages/app lint
      - name: Lint (session sync)
        run: |
          if [ -f packages/docker-git-session-sync/package.json ] && \
            bun -e "const pkg=JSON.parse(await Bun.file('packages/docker-git-session-sync/package.json').text()); process.exit(pkg.scripts?.lint ? 0 : 1)"; then
            bun run --cwd packages/docker-git-session-sync lint
          else
            echo "packages/docker-git-session-sync lint script is not present; skipping"
          fi
      - name: Lint (lib)
        run: bun run --cwd packages/lib lint
      - name: Lint (api)
        run: bun run --cwd packages/api lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Test (app)
        run: bun run --cwd packages/app test
      - name: Test (session sync)
        run: |
          if [ -f packages/docker-git-session-sync/package.json ]; then
            bun run --cwd packages/docker-git-session-sync test
          else
            echo "packages/docker-git-session-sync is not present; skipping"
          fi
      - name: Test (lib)
        run: bun run --cwd packages/lib test
      - name: Test (api)
        run: bun run --cwd packages/api test

  lint-effect:
    name: Lint Effect-TS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Lint Effect-TS (app)
        run: bun run --cwd packages/app lint:effect
      - name: Lint Effect-TS (session sync)
        run: |
          if [ -f packages/docker-git-session-sync/package.json ] && \
            bun -e "const pkg=JSON.parse(await Bun.file('packages/docker-git-session-sync/package.json').text()); process.exit(pkg.scripts?.['lint:effect'] ? 0 : 1)"; then
            bun run --cwd packages/docker-git-session-sync lint:effect
          else
            echo "packages/docker-git-session-sync lint:effect script is not present; skipping"
          fi
      - name: Lint Effect-TS (lib)
        run: bun run --cwd packages/lib lint:effect

  e2e-local-package:
    name: E2E (Local package CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Pack and run local package via Bun
        run: bash scripts/e2e/local-package-cli.sh

  e2e-opencode:
    name: E2E (OpenCode)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Docker info
        run: docker version && docker compose version
      - name: OpenCode autoconnect
        run: bash scripts/e2e/opencode-autoconnect.sh

  e2e-clone-cache:
    name: E2E (Clone cache)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Docker info
        run: docker version && docker compose version
      - name: Clone cache reuse
        run: bash scripts/e2e/clone-cache.sh

  e2e-login-context:
    name: E2E (Login context)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Docker info
        run: docker version && docker compose version
      - name: Login context notice
        run: bash scripts/e2e/login-context.sh

  e2e-runtime-volumes-ssh:
    name: E2E (Runtime volumes + SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Docker info
        run: docker version && docker compose version
      - name: Runtime volumes + host SSH CLI
        run: bash scripts/e2e/runtime-volumes-ssh.sh

  e2e-clone-auto-open-ssh:
    name: E2E (Clone auto-open SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Docker info
        run: docker version && docker compose version
      - name: Clone auto-open SSH
        run: bash scripts/e2e/clone-auto-open-ssh.sh
