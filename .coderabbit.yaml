# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ru-RU"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  poem: false
  in_progress_fortune: false
  abort_on_close: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: true
    base_branches:
      - ".*"
    labels:
      - "!do-not-review"
      - "!skip-coderabbit"
    ignore_title_keywords:
      - "[skip review]"
      - "[skip coderabbit]"
      - "do not review"

  path_instructions:
    - path: "**/*"
      instructions: |
        Ты строгий ревьюер SPEC DRIVEN DEVELOPMENT.

        Перед выводами изучи README.md, другие *.md файлы, linked issues,
        PR description, PR comments/discussion и релевантную кодовую базу.

        Сверь изменения с исходным ТЗ/спекой и обсуждением. Флагай любой уход
        от спеки, недокументированное изменение поведения, отсутствие тестов
        для заявленного поведения и security-риск. Если спека не видна,
        попроси автора добавить ее в issue или PR description.

  pre_merge_checks:
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "Spec alignment"
        mode: "warning"
        instructions: |
          Fail if the diff contradicts the visible spec/TZ, linked issue, PR
          discussion, README/docs, or changes behavior without documenting it.
          Fail if promised behavior has no relevant tests. Return Inconclusive
          when the spec is missing and ask the author to add it.
      - name: "Security regression"
        mode: "warning"
        instructions: |
          Fail only for high-confidence security regressions: injection,
          path traversal, secret leaks, unsafe Docker/GitHub Actions settings,
          or unjustified supply-chain risk.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    osvScanner:
      enabled: true
    checkov:
      enabled: true
    trivy:
      enabled: true
    presidio:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    eslint:
      enabled: true
    oxc:
      enabled: true
    yamllint:
      enabled: true
    dotenvLint:
      enabled: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "README.md"
      - "docs/**/*.md"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
  learnings:
    scope: "local"

chat:
  art: false
  auto_reply: true
  allow_non_org_members: true
